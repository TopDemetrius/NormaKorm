<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НормаКорм — Вхід</title>
    <meta name="description" content="Вхід до системи оптимізації раціонів НормаКорм">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-secondary);
            position: relative;
            overflow: hidden;
        }

        /* Декоративний фон */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            z-index: 1;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .auth-logo-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .auth-card {
            background: var(--bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            padding: 36px;
            box-shadow: var(--shadow-lg);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .auth-error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--status-violation-bg);
            border: 1px solid var(--status-violation-border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--status-violation);
            font-weight: 500;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 8px;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap .form-input {
            padding-left: 42px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border-light);
            margin: 24px 0;
        }

        .hint-box {
            background: var(--primary-bg);
            border: 1px solid rgba(108, 60, 225, 0.15);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .hint-box svg { flex-shrink: 0; margin-top: 1px; }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Логотип -->
        <div class="auth-logo">
            <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="14" fill="#6C3CE1"/>
                <path d="M8 14C8 10.686 10.686 8 14 8C17.314 8 20 10.686 20 14C20 17.314 17.314 20 14 20" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <circle cx="14" cy="14" r="3" fill="white"/>
            </svg>
            <span class="auth-logo-text">НормаКорм</span>
        </div>

        <!-- Картка входу -->
        <div class="auth-card">
            <h1 class="auth-title">Вхід до системи</h1>
            <p class="auth-subtitle">Введіть свої дані для авторизації</p>

            {% if error %}
            <div class="auth-error" id="auth-error-msg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Логін</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input
                            type="text"
                            class="form-input"
                            id="login-username"
                            name="username"
                            placeholder="Ваш логін"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:0">
                    <label class="form-label" for="login-password">Пароль</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input
                            type="password"
                            class="form-input"
                            id="login-password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="login-submit-btn">
                    Увійти
                </button>
            </form>


        </div>

        <div class="auth-footer">
            Немає облікового запису?
            <a href="/register" id="goto-register">Зареєструватись</a>
        </div>
    </div>

    <script>
        // Анімація кнопки при відправці
        document.getElementById('login-form').addEventListener('submit', function() {
            const btn = document.getElementById('login-submit-btn');
            btn.textContent = 'Вхід...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
