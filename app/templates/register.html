<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НормаКорм — Реєстрація</title>
    <meta name="description" content="Реєстрація нового облікового запису НормаКорм">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-secondary);
            position: relative;
            overflow: hidden;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            z-index: 1;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .auth-logo-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .auth-card {
            background: var(--bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            padding: 36px;
            box-shadow: var(--shadow-lg);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .auth-error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--status-violation-bg);
            border: 1px solid var(--status-violation-border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--status-violation);
            font-weight: 500;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 8px;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap .form-input {
            padding-left: 42px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .required-mark {
            color: var(--status-violation);
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin: 20px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Логотип -->
        <div class="auth-logo">
            <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="14" fill="#6C3CE1"/>
                <path d="M8 14C8 10.686 10.686 8 14 8C17.314 8 20 10.686 20 14C20 17.314 17.314 20 14 20" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <circle cx="14" cy="14" r="3" fill="white"/>
            </svg>
            <span class="auth-logo-text">НормаКорм</span>
        </div>

        <!-- Картка реєстрації -->
        <div class="auth-card">
            <h1 class="auth-title">Створення облікового запису</h1>
            <p class="auth-subtitle">Заповніть дані для реєстрації в системі</p>

            {% if error %}
            <div class="auth-error" id="register-error-msg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/register" id="register-form">

                <div class="section-label">Особисті дані</div>

                <div class="form-row">
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label" for="reg-name">
                            Повне ім'я <span class="required-mark">*</span>
                        </label>
                        <input
                            type="text"
                            class="form-input"
                            id="reg-name"
                            name="name"
                            placeholder="Ім'я Прізвище"
                            required
                        >
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label" for="reg-position">Посада</label>
                        <input
                            type="text"
                            class="form-input"
                            id="reg-position"
                            name="position"
                            placeholder="Зоотехнік"
                        >
                    </div>
                </div>

                <div class="form-group" style="margin-top:14px">
                    <label class="form-label" for="reg-email">Email</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input
                            type="email"
                            class="form-input"
                            id="reg-email"
                            name="email"
                            placeholder="email@example.com"
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="section-label">Дані для входу</div>

                <div class="form-group">
                    <label class="form-label" for="reg-username">
                        Логін <span class="required-mark">*</span>
                    </label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input
                            type="text"
                            class="form-input"
                            id="reg-username"
                            name="username"
                            placeholder="Унікальний логін"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label" for="reg-password">
                            Пароль <span class="required-mark">*</span>
                        </label>
                        <div class="input-icon-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input
                                type="password"
                                class="form-input"
                                id="reg-password"
                                name="password"
                                placeholder="Мін. 6 символів"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label" for="reg-password2">
                            Повтор паролю <span class="required-mark">*</span>
                        </label>
                        <div class="input-icon-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input
                                type="password"
                                class="form-input"
                                id="reg-password2"
                                name="password2"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="register-submit-btn">
                    Зареєструватись
                </button>
            </form>
        </div>

        <div class="auth-footer">
            Вже є обліковий запис?
            <a href="/login" id="goto-login">Увійти</a>
        </div>
    </div>

    <script>
        // Клієнтська валідація паролів
        document.getElementById('register-form').addEventListener('submit', function(e) {
            const p1 = document.getElementById('reg-password').value;
            const p2 = document.getElementById('reg-password2').value;
            if (p1 !== p2) {
                e.preventDefault();
                // Показати помилку
                let errEl = document.getElementById('register-error-msg');
                if (!errEl) {
                    errEl = document.createElement('div');
                    errEl.id = 'register-error-msg';
                    errEl.className = 'auth-error';
                    errEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg> Паролі не співпадають`;
                    this.insertBefore(errEl, this.firstChild);
                } else {
                    errEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg> Паролі не співпадають`;
                }
                return;
            }
            const btn = document.getElementById('register-submit-btn');
            btn.textContent = 'Реєстрація...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
